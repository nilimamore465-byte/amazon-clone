<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Login </title>
    


    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box{
            width: 350px;
            background:#fff;
            padding: 25px;
            border:1px solid #ddd;
            border-radius:8px;
        }

        h2{
            text-align: center;
            margin-bottom: 20px;

        }

        label{
            font-weight: bold;

        }
        input{
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border:1px solid#ccc ;
            border-radius: pointer;

        }

    </style>
</head>
<body>
    <div class="Login-container">
        <h1>Login Page</h1>             
        <form>
            <label>Eamil</label>
            <input type="Email" placeholder="Enter Eamil" required ><br>
            <label>Password</label>
            <input type="password" placeholder="Enter Password" required><br>
           </form>
           <a href="registration.html">
            <button type="button">submit</button>
           </a>
        
            <p><a href="amazon.html">Back</a></p>
        
    </div>
</body>
</html>
